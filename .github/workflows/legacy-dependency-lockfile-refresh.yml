name: Legacy dependency lockfile refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infinicus-platform/package.json'
      - 'infinicus-platform/apps/api/package.json'
      - 'infinicus-platform/apps/web/package.json'
      - '.github/workflows/legacy-dependency-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: infinicus-platform/pnpm-lock.yaml
      - name: Regenerate lockfile
        working-directory: infinicus-platform
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infinicus-platform/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes."
          else
            git commit -m "chore(security): regenerate pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
