name: BUILD-32 Operations Runtime CI

on:
  pull_request:
    paths:
      - "infinicus-platform/packages/business-operations-runtime/**"
      - "infinicus-platform/packages/database/**"
      - "infinicus-platform/packages/handoff-contracts/**"
      - "infinicus-platform/infrastructure/database/**"
      - ".github/workflows/build-32.yml"

defaults:
  run:
    working-directory: infinicus-platform

env:
  CI_ADMIN_USER: infinicus_ci_admin
  CI_ADMIN_PASSWORD: ci_admin_pw
  CI_APP_USER: app_test_user
  CI_APP_PASSWORD: ci_app_pw
  CI_DB_NAME: infinicus_ci

jobs:
  operations-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infinicus_ci_admin
          POSTGRES_PASSWORD: ci_admin_pw
          POSTGRES_DB: infinicus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infinicus-platform/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infinicus-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint runtime and dependencies
        run: npx turbo run lint --filter=@infinicus/business-operations-runtime...

      - name: Typecheck runtime and dependencies
        run: npx turbo run typecheck --filter=@infinicus/business-operations-runtime...

      - name: Build runtime and dependencies
        run: npx turbo run build --filter=@infinicus/business-operations-runtime...

      - name: Create least-privilege application role
        run: |
          PGPASSWORD="$CI_ADMIN_PASSWORD" psql -h localhost -U "$CI_ADMIN_USER" -d "$CI_DB_NAME" -c \
            "CREATE ROLE ${CI_APP_USER} LOGIN PASSWORD '${CI_APP_PASSWORD}';"

      - name: Apply migrations
        run: |
          DATABASE_URL="postgresql://${CI_ADMIN_USER}:${CI_ADMIN_PASSWORD}@localhost:5432/${CI_DB_NAME}" \
            infrastructure/deployment/scripts/migration-gate.sh

      - name: Grant application role access
        run: |
          ADMIN_DATABASE_URL="postgresql://${CI_ADMIN_USER}:${CI_ADMIN_PASSWORD}@localhost:5432/${CI_DB_NAME}" \
          APP_ROLE="$CI_APP_USER" \
            infrastructure/database/scripts/grant-app-role.sh

      - name: Test BUILD-32 runtime
        run: npx turbo run test --filter=@infinicus/business-operations-runtime
        env:
          DATABASE_URL: postgresql://${{ env.CI_APP_USER }}:${{ env.CI_APP_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}
          ADMIN_DATABASE_URL: postgresql://${{ env.CI_ADMIN_USER }}:${{ env.CI_ADMIN_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}
